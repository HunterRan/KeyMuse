<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient - deep cosmic -->
    <radialGradient id="bg" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b3b"/>
      <stop offset="60%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#070510"/>
    </radialGradient>

    <!-- Main K gradient - flowing aurora -->
    <linearGradient id="kGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="35%" stop-color="#7b2ff7"/>
      <stop offset="70%" stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>

    <!-- K glow gradient -->
    <linearGradient id="kGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#7b2ff7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff2d95" stop-opacity="0"/>
    </linearGradient>

    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#ff2d95"/>
    </linearGradient>

    <!-- Glass reflection -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feComposite in="offset" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadow"/>
      <feFlood flood-color="#000" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="shadow" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shadow"/>
      </feMerge>
    </filter>

    <!-- Aurora particle filter -->
    <filter id="particle">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="224" fill="url(#bg)" stroke="#1a1535" stroke-width="1.5"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>

  <!-- Glass overlay -->
  <circle cx="256" cy="256" r="224" fill="url(#glass)"/>

  <!-- Aurora glow behind K -->
  <ellipse cx="256" cy="280" rx="100" ry="60" fill="url(#kGlow)" filter="url(#softGlow)"/>

  <!-- Artistic K - flowing calligraphic strokes -->
  <g filter="url(#glow)">
    <!-- Main vertical stroke - elegant curved -->
    <path d="M 172 148 
             C 172 148, 168 220, 182 256 
             C 192 282, 210 320, 218 364
             C 222 386, 220 396, 216 400"
          fill="none" stroke="url(#kGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Upper diagonal - sweeping arc -->
    <path d="M 185 218
             C 210 210, 240 198, 270 186
             C 300 174, 320 170, 340 174
             C 355 178, 358 186, 350 198
             C 340 214, 310 238, 268 262"
          fill="none" stroke="url(#kGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lower diagonal - flowing down -->
    <path d="M 272 258
             C 300 270, 318 292, 332 316
             C 344 338, 350 362, 346 378
             C 342 394, 330 400, 312 398
             C 296 396, 274 386, 252 370"
          fill="none" stroke="url(#kGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Subtle highlight on vertical stroke -->
  <path d="M 168 158 C 168 220, 180 256, 190 282"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" filter="url(#glow)"/>

  <!-- Mouse cursor integrated into negative space -->
  <g transform="translate(308, 148)" opacity="0.6" filter="url(#innerShadow)">
    <path d="M 0 0 L 8 36 L 18 26 L 28 44 L 38 38 L 28 20 L 40 18 Z"
          fill="none" stroke="url(#kGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 4 4 L 10 30 L 18 22 L 28 40 L 32 36 L 26 20 L 34 16 Z"
          fill="url(#kGrad)" opacity="0.3"/>
  </g>

  <!-- Decorative floating particles -->
  <g fill="#00d4ff" opacity="0.5" filter="url(#particle)">
    <circle cx="140" cy="160" r="2.5"/>
    <circle cx="160" cy="380" r="2"/>
    <circle cx="370" cy="150" r="1.8"/>
    <circle cx="350" cy="400" r="2.2"/>
    <circle cx="130" cy="300" r="1.5"/>
    <circle cx="380" cy="280" r="2"/>
  </g>

  <g fill="#ff2d95" opacity="0.4" filter="url(#particle)">
    <circle cx="150" cy="220" r="1.5"/>
    <circle cx="360" cy="180" r="2"/>
    <circle cx="380" cy="360" r="1.5"/>
    <circle cx="120" cy="350" r="1.8"/>
  </g>

  <g fill="#7b2ff7" opacity="0.3" filter="url(#particle)">
    <circle cx="134" cy="128" r="1.2"/>
    <circle cx="388" cy="128" r="1.5"/>
    <circle cx="400" cy="390" r="1.2"/>
    <circle cx="112" cy="390" r="1"/>
  </g>

  <!-- Outer shimmer dots -->
  <g fill="#ffffff" opacity="0.12">
    <circle cx="256" cy="40" r="2"/>
    <circle cx="256" cy="472" r="2"/>
    <circle cx="40" cy="256" r="2"/>
    <circle cx="472" cy="256" r="2"/>
    <circle cx="108" cy="108" r="1.5"/>
    <circle cx="404" cy="108" r="1.5"/>
    <circle cx="108" cy="404" r="1.5"/>
    <circle cx="404" cy="404" r="1.5"/>
  </g>
</svg>
